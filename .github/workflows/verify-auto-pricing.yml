name: Verify live researched automobile prices and curated set gallery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-auto-pricing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify all live price records, collection links and preview-only safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          root="https://burtonfound.timharmar.workers.dev/"
          def get(path):
              request=urllib.request.Request(root+path,headers={"User-Agent":"BurtonFound-price-QA/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(request,timeout=25) as response:
                  assert response.status==200,(path,response.status)
                  return response.read()
          def data(path):
              src=get(path).decode()
              return json.loads(src.split("=",1)[1].strip().rstrip(";"))
          cars=data("vintage-cars-data.js")
          sets=data("vintage-cars-sets.js")
          products=data("products.js")["inventory"]
          assert len(cars)==80 and len(sets)==18 and len(products)==22
          assert all(c.get("salesEnabled") is False and not c.get("physicalItemVerified") and "price" not in c for c in cars)
          assert all(c.get("description") and 12.95<=c.get("suggestedPriceCAD",0)<=24.95 and c.get("image","").startswith("assets/images/curated/") for c in cars)
          assert all(b.get("salesEnabled") is False and b["suggestedSetPriceCAD"]<b["individualSuggestedTotalCAD"] for b in sets)
          assert len(set(s for b in sets for s in b["componentSkus"]))==53
          html=get("vintage-cars.html").decode()
          for s in ["vintage-cars-sets.js","vintage-cars-pricing.css","bundleGrid","pricingMethod","not yet for sale","noindex"]:
              assert s in html,("Missing gallery element",s)
          for p in ["index.html","storefront.html"]:
              assert "vintage-cars.html" in get(p).decode()
          healthy=json.loads(get("api/health"))
          assert healthy.get("checkout")=="preview_only","Live payments must remain disabled"
          print("PASS: 80 deduplicated CAD price proposals, original-scan comparisons and individually written descriptions")
          print("PASS: 18 unique curated grouping recommendations covering 53 distinct designs")
          print("PASS: 22 original listings unchanged and checkout held in preview_only")
          PY
      - name: Install browser automation for reliable visual inspection
        run: python3 -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Render real curated sets and product cards on desktop and mobile
        shell: bash
        run: |
          python3 - <<'PY'
          import os,shutil,pathlib
          from playwright.sync_api import sync_playwright
          chrome=next((shutil.which(n) for n in ["google-chrome","google-chrome-stable","chromium","chromium-browser"] if shutil.which(n)),None)
          assert chrome, "Chrome/Chromium browser is required for real visual verification"
          root="https://burtonfound.timharmar.workers.dev/vintage-cars.html"
          dest=pathlib.Path("/tmp/auto-price-qa");dest.mkdir(parents=True,exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=chrome,headless=True,args=["--no-sandbox","--disable-dev-shm-usage"])
              try:
                  for width,height,label in [(1440,900,"desktop"),(390,844,"mobile")]:
                      context=browser.new_context(viewport={"width":width,"height":height},device_scale_factor=1,reduced_motion="reduce")
                      page=context.new_page()
                      errors=[]
                      page.on("pageerror",lambda err:errors.append(str(err)))
                      page.goto(root,wait_until="domcontentloaded",timeout=60000)
                      page.locator(".archive-bundle-card").first.wait_for(state="visible",timeout=20000)
                      page.locator("#cards .card").first.wait_for(state="visible",timeout=20000)
                      assert page.locator(".archive-bundle-card").count()==18,("Missing set cards",label)
                      assert page.locator("#cards .archive-page-price").count()==24,("Missing priced cards",label)
                      assert page.locator("#cards .archive-page-description").count()==24,("Missing page descriptions",label)
                      assert page.locator("#cards .archive-page-details").count()==24,("Missing full descriptions",label)
                      assert page.locator("#showAllSets").count()==1,("Set expansion control missing",label)
                      assert page.locator("#toggleOriginal").count()==1,("Original scan comparison control missing",label)
                      assert page.locator(".archive-bundle-card:visible").count()==6,("Expected 6 initial featured sets",label)
                      assert page.get_by_text("Suggested set asking price").count()==18
                      assert not errors,("Browser JS error",label,errors)
                      page.locator(".archive-bundle-card").first.scroll_into_view_if_needed()
                      page.wait_for_timeout(350)
                      out=dest/(label+"-sets.png")
                      page.screenshot(path=str(out),animations="disabled")
                      assert out.stat().st_size>15000,("Unpainted bundle viewport",label,out.stat().st_size)
                      print("PASS: real set-card viewport",label,out.stat().st_size)
                      page.locator("#cards .card").first.scroll_into_view_if_needed()
                      page.wait_for_timeout(500)
                      out=dest/(label+"-gallery.png")
                      page.screenshot(path=str(out),animations="disabled")
                      assert out.stat().st_size>15000,("Unpainted priced-card viewport",label,out.stat().st_size)
                      print("PASS: real priced-card viewport",label,out.stat().st_size)
                      context.close()
              finally:
                  browser.close()
          print("PASS: desktop and phone render 18 curated sets and 24 priced, detailed visible gallery cards with no JS errors")
          PY
      - name: Attach real responsive screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BurtonFound-Vintage-Auto-Pricing-Desktop-Mobile
          path: /tmp/auto-price-qa/*.png
          retention-days: 7
          if-no-files-found: ignore

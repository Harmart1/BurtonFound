name: Audit automobile duplicate scans and image condition (read only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-auto-duplicates.yml'
      - 'scripts/audit-auto-duplicates.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burtonfound-auto-duplicate-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get current source images
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Python for reproducible photo matching
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned image comparison tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 scipy==1.16.3 opencv-python-headless==4.12.0.88
      - name: Compare photographed print designs and score image quality
        run: python scripts/audit-auto-duplicates.py
      - name: Save match analysis to repository without touching product inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/automobile-visual-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record evidence-based visual duplicate audit for the 93 automobile scans"
            git push origin HEAD:main
          fi
      - name: Attach original-photograph duplicate group contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: automobile-original-scan-duplicate-comparison
          path: reports/automobile-duplicate-review.jpg
          retention-days: 14

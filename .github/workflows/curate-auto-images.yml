name: Create 80 best-quality automobile display images (originals retained)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/curate-auto-images.yml'
      - 'scripts/curate-auto-images.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burtonfound-curated-auto-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out all original and polished scan images
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible image editing dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Create separate archival-faithful curated display images
        run: python scripts/curate-auto-images.py
      - name: Check original images untouched and 80 files produced
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          root=Path("public/assets/images")
          report=json.loads(Path("reports/auto-image-enhancement-v2.json").read_text())
          assert report["distinct_display_design_count"]==80
          assert report["redundant_scans_hidden"]==13
          assert len(list((root/"curated/vintage-cars").glob("*.webp")))==80
          assert len(list((root/"vintage-cars").glob("*.webp")))==93
          assert len(list((root/"polished/vintage-cars").glob("*.webp")))==93
          for item in report["items"]:
              file=Path("public")/item["new_display"]
              with Image.open(file) as photo:
                  photo.verify()
              assert file.stat().st_size>4500,item["sku"]
          print("PASS: 80 high-quality product display images; all 93 source scans and 93 polished first-pass files preserved.")
          PY
          if git diff --name-only -- public/assets/images/vintage-cars public/assets/images/polished/vintage-cars | grep -q .; then
              echo "::error::Source photographs must never be modified."
              exit 1
          fi
      - name: Commit only the curated derivative images and audit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/curated/vintage-cars/ reports/auto-image-enhancement-v2.json
          git commit -m "Add 80 optimally selected source-faithful automobile gallery image derivatives"
          git push origin HEAD:main
      - name: Retain real before-after photographic comparison
        uses: actions/upload-artifact@v4
        with:
          name: BurtonFound-80-Unique-Car-Photos-Comparison
          path: reports/auto-enhancement-before-after.jpg
          retention-days: 14

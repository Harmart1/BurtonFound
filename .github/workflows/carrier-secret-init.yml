name: Initialize private shipping quote signing key (safe)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/carrier-secret-init-trigger.txt]
permissions:
  contents: read
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create missing quote signature secret with Cloudflare (no values logged)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_HINT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,re,json,secrets,urllib.request,urllib.error
          raw=os.environ.get("CF_TOKEN","").strip()
          token=raw.strip("\"'")
          if token.lower().startswith("bearer "):token=token[7:].strip().strip("\"'")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+",token):
              hits=re.findall(r"cf(?:at|ut)_[A-Za-z0-9_.-]+",raw)
              token=hits[0] if len(hits)==1 else ""
          hint=os.environ.get("CF_ACCOUNT_HINT","")
          if not token or not hint:raise SystemExit("Cloudflare deployment credentials unavailable; no settings changed.")
          base="https://api.cloudflare.com/client/v4"
          def request(path,method="GET",data=None):
              headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
              if data is not None:headers["Content-Type"]="application/json"
              req=urllib.request.Request(base+path,headers=headers,method=method,
                  data=json.dumps(data).encode() if data is not None else None)
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:payload=json.load(res)
              except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError):
                  raise SystemExit("Cloudflare request failed; no values logged. Review Workers token permissions.")
              if payload.get("success") is not True:
                  raise SystemExit("Cloudflare denied carrier secret initialization.")
              return payload.get("result")
          ids=re.findall(r"(?<![a-fA-F0-9])[a-fA-F0-9]{32}(?![a-fA-F0-9])",hint)
          if len(ids)>1:raise SystemExit("Ambiguous Cloudflare account; no settings changed.")
          accounts=ids if ids else [a.get("id","") for a in request("/accounts?per_page=50")]
          matches=[]
          for a in accounts:
              if re.fullmatch(r"[a-fA-F0-9]{32}",a) and any(
                w.get("id")=="burtonfound" for w in request("/accounts/"+a+"/workers/scripts") or []):
                  matches.append(a)
          if len(matches)!=1:raise SystemExit("Unable to identify the existing Burton & Found Worker uniquely.")
          base_path="/accounts/"+matches[0]+"/workers/scripts/burtonfound"
          settings=request(base_path+"/settings")
          bindings={b.get("name"):b for b in (settings or {}).get("bindings",[]) if isinstance(b,dict)}
          # Absolutely no new secrets while a production checkout or quote flow could be running.
          for k in ("LIVE_CHECKOUT_ENABLED","LIVE_PAYMENTS_APPROVED","CARRIER_QUOTES_ENABLED"):
              b=bindings.get(k)
              if not b or b.get("type")!="plain_text" or b.get("text")!="false":
                  raise SystemExit("Safety gate not confirmed disabled: "+k+"; no settings changed.")
          existing=bindings.get("SHIPPING_QUOTE_SECRET")
          if existing:
              if existing.get("type") not in ("secret_text","secret_key"):
                  raise SystemExit("Existing signing key binding is not encrypted. No settings changed.")
              print("Private quote-signing key is already present. No rotation or changes.")
              raise SystemExit(0)
          # New random key is generated inside GitHub's ephemeral job process; only sent
          # via HTTPS directly to Cloudflare secret API. Never print, artifact, or persist.
          generated=secrets.token_urlsafe(48)
          request(base_path+"/secrets","PUT",
                  {"name":"SHIPPING_QUOTE_SECRET","text":generated,"type":"secret_text"})
          generated=None
          result=request(base_path+"/secrets/SHIPPING_QUOTE_SECRET")
          if result.get("type")!="secret_text":
              raise SystemExit("Cloudflare did not confirm the encrypted signing key; inspect Worker settings.")
          print("Created and verified an encrypted quote-signing key; payment and carrier quote gates remain disabled.")
          PY

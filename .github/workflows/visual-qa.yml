name: Verify Burton & Found responsive editorial layout (read only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/visual-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed homepage, collection gallery and safety flags
        run: |
          python3 - <<'PY'
          import urllib.request,json
          root="https://burtonfound.timharmar.workers.dev/"
          def fetch(path):
              request=urllib.request.Request(root+path,headers={"User-Agent":"BurtonFound-Visual-QA/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(request,timeout=25) as r:
                  assert r.status==200,(path,r.status)
                  return r.read()
          home=fetch("index.html").decode()
          store=fetch("storefront.html").decode()
          cars=fetch("vintage-cars.html").decode()
          styles=fetch("editorial-refresh.css").decode()
          gallerystyles=fetch("vintage-cars-refined.css").decode()
          assert home.count('class="spotlight spotlight-')==3
          assert 'editorial-refresh.css' in home and 'editorial-refresh.css' in store
          assert 'editorial-archive-band' in store
          assert 'archive-masthead' in cars and 'imageDialog' in cars
          assert 'burton-found-mark.svg' in cars, 'Archive header must carry brand mark'
          assert 'grid-template-columns:minmax(0,1fr) auto' in gallerystyles, 'Mobile header must use the new two-row layout'
          assert 'noindex, nofollow' in home and 'noindex, nofollow' in cars
          assert 'max-width:590px' in styles and 'max-width:550px' in gallerystyles
          for name in ["va-001.webp","va-049.webp","va-093.webp"]:
              b=fetch("assets/images/vintage-cars/"+name)
              assert b[:4]==b"RIFF" and b[8:12]==b"WEBP"
          health=json.loads(fetch("api/health"))
          assert health.get("checkout")=="preview_only"
          print("PASS: three live collections, gallery assets, responsive styles and checkout guard")
          PY
      - name: Render interactive gallery and capture desktop/mobile screenshots
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,shutil,subprocess
          chrome=next((shutil.which(n) for n in ["google-chrome","google-chrome-stable","chromium","chromium-browser"] if shutil.which(n)),None)
          if not chrome:
              print("No Chrome browser bundled in runner. Public asset verification above passed.")
              raise SystemExit(0)
          out=pathlib.Path("/tmp/visual_qa");out.mkdir(parents=True,exist_ok=True)
          root="https://burtonfound.timharmar.workers.dev/"
          flags=["--headless=new","--no-sandbox","--disable-gpu","--disable-dev-shm-usage","--hide-scrollbars","--disable-extensions","--virtual-time-budget=4000"]
          for path,w,h,name in [("vintage-cars.html",1440,900,"automobiles-desktop"),("vintage-cars.html",390,844,"automobiles-mobile"),("index.html",1440,900,"homepage-desktop"),("index.html",390,844,"homepage-mobile")]:
              url=root+path
              args=[chrome,*flags,"--window-size="+str(w)+","+str(h)]
              if path=="vintage-cars.html":
                  r=subprocess.run(args+["--dump-dom",url],capture_output=True,text=True,timeout=90)
                  assert r.returncode==0,("Chrome page rendering failed",name,r.stderr[-500:])
                  assert 'class="card"' in r.stdout,("Gallery not rendered",name)
                  assert "VA-001" in r.stdout,("First product not visible",name)
                  assert 'value="Buick"' in r.stdout,("Car make filter not filled",name)
                  print("PASS: gallery JavaScript, product cards and filters on",name)
              png=out/(name+".png")
              r=subprocess.run(args+["--screenshot="+str(png),url],capture_output=True,text=True,timeout=90)
              assert r.returncode==0 and png.is_file() and png.stat().st_size>5000,("Screenshot failed",name,r.stderr[-500:])
              print("PASS: screenshot",name,png.stat().st_size,"bytes")
          PY
      - name: Attach responsive screenshot samples
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: burtonfound-editorial-visual-qa
          path: /tmp/visual_qa/*.png
          if-no-files-found: ignore
          retention-days: 7

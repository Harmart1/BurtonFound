name: Temporary Canada Post Rating OpenAPI schema audit
on:
  push:
    branches: [canada-us-live-carrier-readiness-2026-11-25]
    paths: [.github/workflows/canada-post-schema-audit.yml]
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official JSON examples and schema
        run: |
          curl --fail --location --silent --show-error --max-time 30 'https://developer-developpeur.canadapost-postescanada.ca/devportal-portaildesdeveloppeurs/download/4632/document' -o /tmp/cp-rating.yaml
          python3 - <<'PY'
          import yaml,json
          spec=yaml.safe_load(open('/tmp/cp-rating.yaml'))
          op=spec['paths']['/prices']['post']
          print('OPERATION REQUEST EXAMPLE:',json.dumps(op.get('requestBody',{}).get('content',{}).get('application/json',{}).get('example'),indent=2)[:2200])
          print('RESPONSES:',json.dumps(op.get('responses'),indent=2)[:4500])
          for k in ('mailingScenario','priceQuotes','priceQuote','priceDetails','serviceStandard','priceDue'):
            x=spec['components']['schemas'].get(k)
            if x:print('SCHEMA',k,json.dumps(x,indent=2)[:3100])
          print('SCHEMA NAMES MATCHING PRICE:',[k for k in spec['components']['schemas'] if any(v in k.lower() for v in ('price','quote','standard'))][:35])
          PY

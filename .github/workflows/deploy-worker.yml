name: Deploy Burton & Found Worker (test-safe)

on:
  workflow_dispatch:
  # Intentional deployment trigger; unrelated code pushes never publish the Worker.
  push:
    branches: [main]
    paths:
      - .github/deploy-worker-trigger.txt

permissions:
  contents: read

concurrency:
  group: burtonfound-worker-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment and safety tests
        run: |
          npm run build:marketing
          npm run check:deploy
          npm test
      - name: Assert live checkout stays disabled
        run: |
          node --input-type=module -e '
          import {readFileSync} from "node:fs";
          const vars=JSON.parse(readFileSync("wrangler.jsonc","utf8")).vars;
          for(const key of ["LIVE_CHECKOUT_ENABLED","LIVE_PAYMENTS_APPROVED","TAX_CONFIGURATION_APPROVED","CARRIER_QUOTES_ENABLED"]){
            if(vars[key]!=="false")throw Error(key+" must be false for this test-safe deployment");
          }
          '
      - name: Resolve Cloudflare account without displaying credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          entered=os.environ.get("CF_API_TOKEN","").strip()
          raw=os.environ.get("CF_ACCOUNT_ID","").strip()
          # Never print input, values, token fragments, or token length.
          # Accept a raw token, or extract a SINGLE recognisable cfut_/cfat_ token from
          # accidentally pasted quotation marks, Bearer prefixes, or command examples.
          token=entered.strip().strip(chr(34)+chr(39)).strip()
          if token.lower().startswith("bearer "):
              token=token[7:].strip().strip(chr(34)+chr(39))
          if not re.fullmatch(r"[A-Za-z0-9_.-]+",token or ""):
              candidates=re.findall(r"cf(?:ut|at)_[A-Za-z0-9_.-]+",entered)
              if len(candidates)==1:
                  token=candidates[0]
                  print("Found one scoped Cloudflare API token in the pasted secret; validating it with Cloudflare.")
              else:
                  sys.exit("CLOUDFLARE_API_TOKEN is not a raw token. Copy only the token value from Cloudflare's 'Create Token' confirmation.")
          if token.startswith("cfk_"):
              sys.exit("CLOUDFLARE_API_TOKEN is a Global API Key; use a scoped Workers Editor API token instead.")
          if token.startswith("cfoat_"):
              sys.exit("CLOUDFLARE_API_TOKEN is a Wrangler OAuth token; use a scoped Cloudflare API token instead.")
          if re.fullmatch(r"[a-fA-F0-9]{32}",token):
              sys.exit("CLOUDFLARE_API_TOKEN appears to hold an Account ID; this is the wrong GitHub secret. Copy the actual API token value.")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+",token or ""):
              sys.exit("CLOUDFLARE_API_TOKEN is not valid token text.")
          if not raw:
              sys.exit("CLOUDFLARE_ACCOUNT_ID secret is missing.")
          def cf(path):
              req=urllib.request.Request("https://api.cloudflare.com/client/v4"+path,
                headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      return json.load(res)
              except urllib.error.HTTPError as e:
                  sys.exit("Cloudflare API rejected account discovery/verification (HTTP %s). Check scoped token permission for Workers Scripts Read/Write."%e.code)
              except Exception:
                  sys.exit("Cloudflare API connection failed during account discovery.")
          # Use the vendor's official verification endpoint instead of guessing token lengths.
          if token.startswith("cfat_"):
              # Account-owned tokens use account-scoped verification, if an ID is available.
              account_match=re.findall(r"[a-fA-F0-9]{32}",raw)
              if len(account_match)!=1:
                  sys.exit("For an account-owned cfat_ token, update CLOUDFLARE_ACCOUNT_ID with the exact 32-character ID from the Workers dashboard.")
              verify_path="/accounts/"+account_match[0]+"/tokens/verify"
          else:
              verify_path="/user/tokens/verify"
          verified=cf(verify_path)
          if not verified.get("success") or verified.get("result",{}).get("status")!="active":
              sys.exit("Cloudflare rejected or deactivated the API token. Create and copy a new scoped Workers Editor token.")
          print("Cloudflare confirms the API token is active.")
          print("::add-mask::"+token)
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("CF_VERIFIED_API_TOKEN="+token+chr(10))
          matches=re.findall(r"(?<![a-fA-F0-9])[a-fA-F0-9]{32}(?![a-fA-F0-9])",raw)
          candidates=[]
          if re.fullmatch(r"[a-fA-F0-9]{32}",raw):
              candidates=[raw]
          elif len(matches)==1:
              candidates=matches
              print("Extracted an Account ID embedded in the pasted secret.")
          else:
              listing=cf("/accounts?per_page=50")
              if not listing.get("success"):
                  sys.exit("Could not list Cloudflare accounts with this token. Copy the Account ID from Workers & Pages.")
              candidates=[a["id"] for a in listing.get("result",[]) if re.fullmatch(r"[a-fA-F0-9]{32}",a.get("id",""))]
              if not candidates:
                  sys.exit("No accessible Cloudflare account IDs found for this token.")
              print("Consulting accessible Cloudflare accounts to identify the existing burtonfound Worker.")
          selected=[]
          for account in candidates:
              data=cf("/accounts/"+account+"/workers/scripts")
              if data.get("success") and any(w.get("id")=="burtonfound" for w in data.get("result",[])):
                  selected.append(account)
          if len(selected)!=1:
              sys.exit("Cannot uniquely verify existing burtonfound Worker in the account(s) accessible to this token. Please correct CLOUDFLARE_ACCOUNT_ID or the token's account scope.")
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("CF_RESOLVED_ACCOUNT_ID="+selected[0]+"\n")
          print("Cloudflare account confirmed: existing burtonfound Worker found. No secret contents displayed.")
          PY
      - name: Deploy to existing burtonfound Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_VERIFIED_API_TOKEN }}
          accountId: ${{ env.CF_RESOLVED_ACCOUNT_ID }}
          command: deploy
      - name: Verify public backend and disabled checkout
        shell: bash
        run: |
          set -euo pipefail
          base="https://burtonfound.timharmar.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 "$base/api/health" -o /tmp/burton-health.json; then
              if python3 - <<'PY'
          import json
          data=json.load(open("/tmp/burton-health.json"))
          assert data.get("service")=="Burton & Found", data
          assert data.get("checkout")=="preview_only", "Checkout must remain disabled"
          print("Verified Burton & Found health:",data.get("checkout"))
          PY
              then
                break
              fi
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "::error::Deployed API is not healthy in disabled-checkout mode."
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error --max-time 15 "$base/api/public-account-config" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert isinstance(data.get("configured"),bool); print("Public account endpoint responsive")'

      - name: Verify visitor homepage and capture desktop/mobile screenshots
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          base="https://burtonfound.timharmar.workers.dev"
          # Use the same curl path that already passed the live API smoke test.
          # Python urllib receives a Cloudflare bot-policy 403 for public static assets.
          curl --fail --silent --show-error --max-time 20 --retry 2 "$base/preview.html" -o /tmp/bf-preview.html
          curl --fail --silent --show-error --max-time 20 --retry 2 "$base/" -o /tmp/bf-homepage.html
          curl --fail --silent --show-error --max-time 20 --retry 2 "$base/homepage-collections.css" -o /tmp/bf-homepage.css
          curl --fail --silent --show-error --max-time 20 --retry 2 "$base/preview-launch.js" -o /tmp/bf-preview.js
          curl --fail --silent --show-error --max-time 20 --retry 2 "$base/preview-launch.css" -o /tmp/bf-preview.css
          curl --fail --silent --show-error --max-time 20 --retry 2 "$base/old-hollywood-new.html" -o /tmp/bf-hollywood.html
          curl --fail --silent --show-error --max-time 20 --retry 2 "$base/assets/images/old-hollywood/ohnew-003-01.webp" -o /tmp/bf-photo.webp
          curl --fail --silent --show-error --max-time 20 --retry 2 "$base/coke-new-products.js" -o /tmp/bf-coke-products.js
          curl --fail --silent --show-error --max-time 20 --retry 2 "$base/coke-new-feature.css" -o /tmp/bf-coke-feature.css
          curl --fail --silent --show-error --max-time 20 --retry 2 "$base/assets/images/coca-cola/new-2026/brussels-1958-hero.webp" -o /tmp/bf-coke-photo.webp
          # Cloudflare may deliver managed-browser challenges to CI clients.
          # Keep diagnostics transparent: HTTP 200 is not proof of the actual page.
          python3 - <<'PY'
          from pathlib import Path
          checks=[
            ('/tmp/bf-preview.html',b'prFeaturedGrid'),
            ('/tmp/bf-coke-products.js',b'CC-SET-F'),
            ('/tmp/bf-coke-feature.css',b'bf-coke-feature-grid'),
            ('/tmp/bf-homepage.html',b'Browse the collection'),
            ('/tmp/bf-homepage.css',b'spotlight-grid'),
            ('/tmp/bf-preview.js',b'OH-NEW-003-01'),
            ('/tmp/bf-preview.css',b'pr-products'),
            ('/tmp/bf-hollywood.html',b'Old Hollywood')
          ]
          for filename,marker in checks:
            data=Path(filename).read_bytes()
            print(('PASS' if marker in data else 'WARNING: MARKER NOT FOUND'),Path(filename).name,'bytes',len(data))
            if marker not in data: print('Response begins:',repr(data[:85]))
          data=Path('/tmp/bf-photo.webp').read_bytes()
          if data[:4]==b'RIFF' and data[8:12]==b'WEBP':
            print('PASS actual image response',len(data))
          else:
            print('WARNING: image endpoint responded with non-WebP content',repr(data[:65]))
          PY
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/bf-coke-photo.webp').read_bytes()
          print('PASS Cocoa-Cola WebP image' if data[:4]==b'RIFF' and data[8:12]==b'WEBP' else 'WARNING Coca-Cola photo endpoint did not return WebP')
          PY
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo "Browser unavailable; HTTP and inventory preflight passed."
            exit 0
          fi
          mkdir -p /tmp/burtonfound-preview
          for spec in '1440 900 desktop' '390 844 mobile'; do
            read -r w h name <<< "$spec"
            "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size="$w,$h" --screenshot="/tmp/burtonfound-preview/$name.png" "$base/" >/dev/null 2>&1
            test -s "/tmp/burtonfound-preview/$name.png"
            echo "PASS rendered preview: $name ($w x $h)"
          done
          for spec in '1440 900 preview-desktop' '390 844 preview-mobile'; do
            read -r w h name <<< "$spec"
            "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size="$w,$h" --screenshot="/tmp/burtonfound-preview/$name.png" "$base/preview.html" >/dev/null 2>&1
            test -s "/tmp/burtonfound-preview/$name.png"
            echo "PASS rendered interactive preview: $name ($w x $h)"
          done
      - name: Attach desktop and mobile homepage screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: burtonfound-coke-2026-11-19
          path: /tmp/burtonfound-preview/*.png
          if-no-files-found: ignore
          retention-days: 14

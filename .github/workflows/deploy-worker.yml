name: Deploy Burton & Found Worker (test-safe)

on:
  workflow_dispatch:
  # Intentional deployment trigger; unrelated code pushes never publish the Worker.
  push:
    branches: [main]
    paths:
      - .github/deploy-worker-trigger.txt

permissions:
  contents: read

concurrency:
  group: burtonfound-worker-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment and safety tests
        run: |
          npm run check:deploy
          npm test
      - name: Assert live checkout stays disabled
        run: |
          node --input-type=module -e '
          import {readFileSync} from "node:fs";
          const vars=JSON.parse(readFileSync("wrangler.jsonc","utf8")).vars;
          for(const key of ["LIVE_CHECKOUT_ENABLED","LIVE_PAYMENTS_APPROVED","TAX_CONFIGURATION_APPROVED","CARRIER_QUOTES_ENABLED"]){
            if(vars[key]!=="false")throw Error(key+" must be false for this test-safe deployment");
          }
          '
      - name: Resolve Cloudflare account without displaying credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          token=os.environ.get("CF_API_TOKEN","").strip()
          raw=os.environ.get("CF_ACCOUNT_ID","").strip()
          # Diagnose by credential type only; never print the token or any substring of it.
          if token.startswith("cfk_"):
              sys.exit("CLOUDFLARE_API_TOKEN contains a Global API Key (cfk_); create a scoped user API token (cfut_) or account API token (cfat_) instead.")
          if token.startswith("cfoat_"):
              sys.exit("CLOUDFLARE_API_TOKEN contains a Wrangler OAuth token (cfoat_); use a scoped user/account API token for GitHub Actions.")
          if token.lower().startswith("bearer "):
              sys.exit("CLOUDFLARE_API_TOKEN includes 'Bearer '. Save only the raw API token value.")
          if not token:
              sys.exit("CLOUDFLARE_API_TOKEN secret is empty or unavailable to this workflow.")
          if re.fullmatch(r"[a-fA-F0-9]{32}",token):
              sys.exit("CLOUDFLARE_API_TOKEN looks like a 32-character Cloudflare Account ID, not an API token. Use the secret VALUE from My Profile > API Tokens.")
          if not re.fullmatch(r"[A-Za-z0-9_.-]{1,512}",token):
              sys.exit("CLOUDFLARE_API_TOKEN contains whitespace, quotes, a pasted command, or unsupported characters. Save only the raw token value.")
          if not raw:
              sys.exit("CLOUDFLARE_ACCOUNT_ID secret is missing.")
          def cf(path):
              req=urllib.request.Request("https://api.cloudflare.com/client/v4"+path,
                headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      return json.load(res)
              except urllib.error.HTTPError as e:
                  sys.exit("Cloudflare API rejected account discovery/verification (HTTP %s). Check scoped token permission for Workers Scripts Read/Write."%e.code)
              except Exception:
                  sys.exit("Cloudflare API connection failed during account discovery.")
          # Use the vendor's official verification endpoint instead of guessing token lengths.
          if token.startswith("cfat_"):
              # Account-owned tokens use account-scoped verification, if an ID is available.
              account_match=re.findall(r"[a-fA-F0-9]{32}",raw)
              if len(account_match)!=1:
                  sys.exit("For an account-owned cfat_ token, update CLOUDFLARE_ACCOUNT_ID with the exact 32-character ID from the Workers dashboard.")
              verify_path="/accounts/"+account_match[0]+"/tokens/verify"
          else:
              verify_path="/user/tokens/verify"
          verified=cf(verify_path)
          if not verified.get("success") or verified.get("result",{}).get("status")!="active":
              sys.exit("Cloudflare rejected or deactivated the API token. Create and copy a new scoped Workers Editor token.")
          print("Cloudflare confirms the API token is active.")
          matches=re.findall(r"(?<![a-fA-F0-9])[a-fA-F0-9]{32}(?![a-fA-F0-9])",raw)
          candidates=[]
          if re.fullmatch(r"[a-fA-F0-9]{32}",raw):
              candidates=[raw]
          elif len(matches)==1:
              candidates=matches
              print("Extracted an Account ID embedded in the pasted secret.")
          else:
              listing=cf("/accounts?per_page=50")
              if not listing.get("success"):
                  sys.exit("Could not list Cloudflare accounts with this token. Copy the Account ID from Workers & Pages.")
              candidates=[a["id"] for a in listing.get("result",[]) if re.fullmatch(r"[a-fA-F0-9]{32}",a.get("id",""))]
              if not candidates:
                  sys.exit("No accessible Cloudflare account IDs found for this token.")
              print("Consulting accessible Cloudflare accounts to identify the existing burtonfound Worker.")
          selected=[]
          for account in candidates:
              data=cf("/accounts/"+account+"/workers/scripts")
              if data.get("success") and any(w.get("id")=="burtonfound" for w in data.get("result",[])):
                  selected.append(account)
          if len(selected)!=1:
              sys.exit("Cannot uniquely verify existing burtonfound Worker in the account(s) accessible to this token. Please correct CLOUDFLARE_ACCOUNT_ID or the token's account scope.")
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("CF_RESOLVED_ACCOUNT_ID="+selected[0]+"\n")
          print("Cloudflare account confirmed: existing burtonfound Worker found. No secret contents displayed.")
          PY
      - name: Deploy to existing burtonfound Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_RESOLVED_ACCOUNT_ID }}
          command: deploy
      - name: Verify public backend and disabled checkout
        shell: bash
        run: |
          set -euo pipefail
          base="https://burtonfound.timharmar.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 "$base/api/health" -o /tmp/burton-health.json; then
              if python3 - <<'PY'
          import json
          data=json.load(open("/tmp/burton-health.json"))
          assert data.get("service")=="Burton & Found", data
          assert data.get("checkout")=="preview_only", "Checkout must remain disabled"
          print("Verified Burton & Found health:",data.get("checkout"))
          PY
              then
                break
              fi
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "::error::Deployed API is not healthy in disabled-checkout mode."
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error --max-time 15 "$base/api/public-account-config" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert isinstance(data.get("configured"),bool); print("Public account endpoint responsive")'

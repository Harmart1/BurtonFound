name: Install Burton & Found Supabase credentials (preview only)

on:
  workflow_dispatch:
    inputs:
      confirm_preview_only:
        description: "I saved the correct Burton & Found Supabase sb_secret key as an encrypted GitHub repository secret and authorize preview-only installation"
        type: boolean
        default: false
        required: true
  # An explicit trigger allows the assistant to run setup after the owner confirms credentials.
  push:
    branches: [main]
    paths:
      - .github/supabase-install-trigger.txt

permissions:
  contents: read

concurrency:
  group: burtonfound-worker-deployment
  cancel-in-progress: false

jobs:
  install-supabase-credentials:
    if: ${{ github.event_name == 'push' || inputs.confirm_preview_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate project target and enforce preview-only payments
        shell: bash
        run: |
          set -euo pipefail
          npm run check:deploy
          npm test
          node --input-type=module -e '
          import {readFileSync} from "node:fs";
          const v=JSON.parse(readFileSync("wrangler.jsonc","utf8")).vars;
          if(v.SUPABASE_URL!=="https://nyvdrgpcwfasajyncnhi.supabase.co")throw Error("Unexpected Supabase project. Installation refused.");
          for(const k of ["LIVE_CHECKOUT_ENABLED","LIVE_PAYMENTS_APPROVED","TAX_CONFIGURATION_APPROVED","CARRIER_QUOTES_ENABLED"])
            if(v[k]!=="false")throw Error(k+" must remain disabled.");
          '
      - name: Validate project-specific Supabase keys without exposing credentials
        shell: bash
        env:
          BF_SERVER_KEY: ${{ secrets.BF_SUPABASE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os,sys,re,json,urllib.request,urllib.error
          url="https://nyvdrgpcwfasajyncnhi.supabase.co"
          config=json.load(open("wrangler.jsonc",encoding="utf-8"))
          public_key=config["vars"].get("SUPABASE_PUBLISHABLE_KEY","")
          keys=[
              ("SUPABASE_PUBLISHABLE_KEY (public Wrangler variable)",public_key,r"sb_publishable_[A-Za-z0-9_-]+"),
              ("BF_SUPABASE_SECRET_KEY",os.environ.get("BF_SERVER_KEY",""),r"sb_secret_[A-Za-z0-9_-]+")
          ]
          for label,value,pattern in keys:
              if not re.fullmatch(pattern,value):
                  sys.exit("Missing or invalid "+label+". Use the matching modern Supabase API key from the Burton & Found project, not the database password.")
              req=urllib.request.Request(url+"/auth/v1/settings",headers={"apikey":value,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      data=json.load(res)
                      if res.status!=200 or not isinstance(data,dict):
                          sys.exit("Supabase authorization failed for "+label)
              except urllib.error.HTTPError as err:
                  sys.exit("The selected Supabase project rejected "+label+" (HTTP "+str(err.code)+"). Check the project and API key.")
              except Exception:
                  sys.exit("The selected Supabase project could not be reached to verify "+label+".")
          print("Supabase validated: public and private keys accepted by the selected project. Values not displayed.")
          PY
      - name: Resolve Cloudflare account without displaying credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          entered=os.environ.get("CF_API_TOKEN","").strip()
          raw=os.environ.get("CF_ACCOUNT_ID","").strip()
          # Never print input, values, token fragments, or token length.
          # Accept a raw token, or extract a SINGLE recognisable cfut_/cfat_ token from
          # accidentally pasted quotation marks, Bearer prefixes, or command examples.
          token=entered.strip().strip(chr(34)+chr(39)).strip()
          if token.lower().startswith("bearer "):
              token=token[7:].strip().strip(chr(34)+chr(39))
          if not re.fullmatch(r"[A-Za-z0-9_.-]+",token or ""):
              candidates=re.findall(r"cf(?:ut|at)_[A-Za-z0-9_.-]+",entered)
              if len(candidates)==1:
                  token=candidates[0]
                  print("Found one scoped Cloudflare API token in the pasted secret; validating it with Cloudflare.")
              else:
                  sys.exit("CLOUDFLARE_API_TOKEN is not a raw token. Copy only the token value from Cloudflare's 'Create Token' confirmation.")
          if token.startswith("cfk_"):
              sys.exit("CLOUDFLARE_API_TOKEN is a Global API Key; use a scoped Workers Editor API token instead.")
          if token.startswith("cfoat_"):
              sys.exit("CLOUDFLARE_API_TOKEN is a Wrangler OAuth token; use a scoped Cloudflare API token instead.")
          if re.fullmatch(r"[a-fA-F0-9]{32}",token):
              sys.exit("CLOUDFLARE_API_TOKEN appears to hold an Account ID; this is the wrong GitHub secret. Copy the actual API token value.")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+",token or ""):
              sys.exit("CLOUDFLARE_API_TOKEN is not valid token text.")
          if not raw:
              sys.exit("CLOUDFLARE_ACCOUNT_ID secret is missing.")
          def cf(path):
              req=urllib.request.Request("https://api.cloudflare.com/client/v4"+path,
                headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      return json.load(res)
              except urllib.error.HTTPError as e:
                  sys.exit("Cloudflare API rejected account discovery/verification (HTTP %s). Check scoped token permission for Workers Scripts Read/Write."%e.code)
              except Exception:
                  sys.exit("Cloudflare API connection failed during account discovery.")
          # Use the vendor's official verification endpoint instead of guessing token lengths.
          if token.startswith("cfat_"):
              # Account-owned tokens use account-scoped verification, if an ID is available.
              account_match=re.findall(r"[a-fA-F0-9]{32}",raw)
              if len(account_match)!=1:
                  sys.exit("For an account-owned cfat_ token, update CLOUDFLARE_ACCOUNT_ID with the exact 32-character ID from the Workers dashboard.")
              verify_path="/accounts/"+account_match[0]+"/tokens/verify"
          else:
              verify_path="/user/tokens/verify"
          verified=cf(verify_path)
          if not verified.get("success") or verified.get("result",{}).get("status")!="active":
              sys.exit("Cloudflare rejected or deactivated the API token. Create and copy a new scoped Workers Editor token.")
          print("Cloudflare confirms the API token is active.")
          print("::add-mask::"+token)
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("CF_VERIFIED_API_TOKEN="+token+chr(10))
          matches=re.findall(r"(?<![a-fA-F0-9])[a-fA-F0-9]{32}(?![a-fA-F0-9])",raw)
          candidates=[]
          if re.fullmatch(r"[a-fA-F0-9]{32}",raw):
              candidates=[raw]
          elif len(matches)==1:
              candidates=matches
              print("Extracted an Account ID embedded in the pasted secret.")
          else:
              listing=cf("/accounts?per_page=50")
              if not listing.get("success"):
                  sys.exit("Could not list Cloudflare accounts with this token. Copy the Account ID from Workers & Pages.")
              candidates=[a["id"] for a in listing.get("result",[]) if re.fullmatch(r"[a-fA-F0-9]{32}",a.get("id",""))]
              if not candidates:
                  sys.exit("No accessible Cloudflare account IDs found for this token.")
              print("Consulting accessible Cloudflare accounts to identify the existing burtonfound Worker.")
          selected=[]
          for account in candidates:
              data=cf("/accounts/"+account+"/workers/scripts")
              if data.get("success") and any(w.get("id")=="burtonfound" for w in data.get("result",[])):
                  selected.append(account)
          if len(selected)!=1:
              sys.exit("Cannot uniquely verify existing burtonfound Worker in the account(s) accessible to this token. Please correct CLOUDFLARE_ACCOUNT_ID or the token's account scope.")
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("CF_RESOLVED_ACCOUNT_ID="+selected[0]+"\n")
          print("Cloudflare account confirmed: existing burtonfound Worker found. No secret contents displayed.")
          PY
      - name: Install only Supabase credentials into existing Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_VERIFIED_API_TOKEN }}
          accountId: ${{ env.CF_RESOLVED_ACCOUNT_ID }}
          command: deploy
          secrets: |
            SUPABASE_SECRET_KEY
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.BF_SUPABASE_SECRET_KEY }}
      - name: Verify Supabase public setup and checkout remains disabled
        shell: bash
        run: |
          set -euo pipefail
          base="https://burtonfound.timharmar.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 "$base/api/health" -o /tmp/bf-health.json &&
               curl --fail --silent --show-error --max-time 15 "$base/api/public-account-config" -o /tmp/bf-account.json &&
               python3 - <<'PY'
          import json
          health=json.load(open("/tmp/bf-health.json"))
          account=json.load(open("/tmp/bf-account.json"))
          assert health.get("service")=="Burton & Found"
          assert health.get("checkout")=="preview_only"
          assert account.get("configured") is True
          assert account.get("supabaseUrl")=="https://nyvdrgpcwfasajyncnhi.supabase.co"
          assert account.get("supabasePublishableKey","").startswith("sb_publishable_")
          print("Confirmed Supabase public account config is exposed safely and live checkout disabled.")
          PY
            then
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "::error::Supabase config was not published or checkout safety verification failed."
              exit 1
            fi
            sleep 5
          done

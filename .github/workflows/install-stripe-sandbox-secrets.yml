name: Configure Burton & Found Stripe SANDBOX secrets (manual only)

on:
  # Explicit, authorized assistant-triggered installation after the owner stores fresh keys.
  # Ordinary commits never deploy credentials.
  push:
    branches: [main]
    paths:
      - .github/stripe-install-trigger.txt
  workflow_dispatch:
    inputs:
      confirm_sandbox_only:
        description: "I rotated any exposed key, saved a NEW sk_test_ key and whsec_ secret in GitHub Actions secrets, and authorize a test-only Worker update"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: burtonfound-worker-deployment
  cancel-in-progress: false

jobs:
  install-sandbox-secrets:
    if: ${{ github.event_name == 'push' || inputs.confirm_sandbox_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify code and payment-disabled configuration
        run: |
          set -euo pipefail
          npm run check:deploy
          npm test
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const vars=JSON.parse(readFileSync("wrangler.jsonc","utf8")).vars;
            for(const name of ["LIVE_CHECKOUT_ENABLED","LIVE_PAYMENTS_APPROVED","TAX_CONFIGURATION_APPROVED","CARRIER_QUOTES_ENABLED"]){
              if(vars[name]!=="false")throw Error(name+" must remain false for this workflow");
            }
          '
      - name: Verify freshly rotated sandbox credentials are present
        shell: bash
        env:
          STRIPE_SANDBOX_KEY: ${{ secrets.BF_STRIPE_TEST_SECRET_KEY }}
          STRIPE_SANDBOX_WEBHOOK: ${{ secrets.BF_STRIPE_TEST_WEBHOOK_SECRET }}
        run: |
          python3 - <<'PY'
          import os,sys,re
          key=os.environ.get("STRIPE_SANDBOX_KEY","")
          webhook=os.environ.get("STRIPE_SANDBOX_WEBHOOK","")
          if not re.fullmatch(r"sk_test_[A-Za-z0-9]+",key):
              sys.exit("Missing or invalid BF_STRIPE_TEST_SECRET_KEY: use a newly rotated sk_test_ key as an encrypted GitHub Actions secret.")
          if not re.fullmatch(r"whsec_[A-Za-z0-9]+",webhook):
              sys.exit("Missing or invalid BF_STRIPE_TEST_WEBHOOK_SECRET: use the Stripe sandbox webhook endpoint signing secret.")
          print("Both Stripe sandbox credentials have expected formats. Their values are not displayed.")
          PY
      - name: Resolve Cloudflare account without displaying credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          entered=os.environ.get("CF_API_TOKEN","").strip()
          raw=os.environ.get("CF_ACCOUNT_ID","").strip()
          # Never print input, values, token fragments, or token length.
          # Accept a raw token, or extract a SINGLE recognisable cfut_/cfat_ token from
          # accidentally pasted quotation marks, Bearer prefixes, or command examples.
          token=entered.strip().strip(chr(34)+chr(39)).strip()
          if token.lower().startswith("bearer "):
              token=token[7:].strip().strip(chr(34)+chr(39))
          if not re.fullmatch(r"[A-Za-z0-9_.-]+",token or ""):
              candidates=re.findall(r"cf(?:ut|at)_[A-Za-z0-9_.-]+",entered)
              if len(candidates)==1:
                  token=candidates[0]
                  print("Found one scoped Cloudflare API token in the pasted secret; validating it with Cloudflare.")
              else:
                  sys.exit("CLOUDFLARE_API_TOKEN is not a raw token. Copy only the token value from Cloudflare's 'Create Token' confirmation.")
          if token.startswith("cfk_"):
              sys.exit("CLOUDFLARE_API_TOKEN is a Global API Key; use a scoped Workers Editor API token instead.")
          if token.startswith("cfoat_"):
              sys.exit("CLOUDFLARE_API_TOKEN is a Wrangler OAuth token; use a scoped Cloudflare API token instead.")
          if re.fullmatch(r"[a-fA-F0-9]{32}",token):
              sys.exit("CLOUDFLARE_API_TOKEN appears to hold an Account ID; this is the wrong GitHub secret. Copy the actual API token value.")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+",token or ""):
              sys.exit("CLOUDFLARE_API_TOKEN is not valid token text.")
          if not raw:
              sys.exit("CLOUDFLARE_ACCOUNT_ID secret is missing.")
          def cf(path):
              req=urllib.request.Request("https://api.cloudflare.com/client/v4"+path,
                headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      return json.load(res)
              except urllib.error.HTTPError as e:
                  sys.exit("Cloudflare API rejected account discovery/verification (HTTP %s). Check scoped token permission for Workers Scripts Read/Write."%e.code)
              except Exception:
                  sys.exit("Cloudflare API connection failed during account discovery.")
          # Use the vendor's official verification endpoint instead of guessing token lengths.
          if token.startswith("cfat_"):
              # Account-owned tokens use account-scoped verification, if an ID is available.
              account_match=re.findall(r"[a-fA-F0-9]{32}",raw)
              if len(account_match)!=1:
                  sys.exit("For an account-owned cfat_ token, update CLOUDFLARE_ACCOUNT_ID with the exact 32-character ID from the Workers dashboard.")
              verify_path="/accounts/"+account_match[0]+"/tokens/verify"
          else:
              verify_path="/user/tokens/verify"
          verified=cf(verify_path)
          if not verified.get("success") or verified.get("result",{}).get("status")!="active":
              sys.exit("Cloudflare rejected or deactivated the API token. Create and copy a new scoped Workers Editor token.")
          print("Cloudflare confirms the API token is active.")
          print("::add-mask::"+token)
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("CF_VERIFIED_API_TOKEN="+token+chr(10))
          matches=re.findall(r"(?<![a-fA-F0-9])[a-fA-F0-9]{32}(?![a-fA-F0-9])",raw)
          candidates=[]
          if re.fullmatch(r"[a-fA-F0-9]{32}",raw):
              candidates=[raw]
          elif len(matches)==1:
              candidates=matches
              print("Extracted an Account ID embedded in the pasted secret.")
          else:
              listing=cf("/accounts?per_page=50")
              if not listing.get("success"):
                  sys.exit("Could not list Cloudflare accounts with this token. Copy the Account ID from Workers & Pages.")
              candidates=[a["id"] for a in listing.get("result",[]) if re.fullmatch(r"[a-fA-F0-9]{32}",a.get("id",""))]
              if not candidates:
                  sys.exit("No accessible Cloudflare account IDs found for this token.")
              print("Consulting accessible Cloudflare accounts to identify the existing burtonfound Worker.")
          selected=[]
          for account in candidates:
              data=cf("/accounts/"+account+"/workers/scripts")
              if data.get("success") and any(w.get("id")=="burtonfound" for w in data.get("result",[])):
                  selected.append(account)
          if len(selected)!=1:
              sys.exit("Cannot uniquely verify existing burtonfound Worker in the account(s) accessible to this token. Please correct CLOUDFLARE_ACCOUNT_ID or the token's account scope.")
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("CF_RESOLVED_ACCOUNT_ID="+selected[0]+"\n")
          print("Cloudflare account confirmed: existing burtonfound Worker found. No secret contents displayed.")
          PY
      - name: Install only test Stripe secrets into existing Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_VERIFIED_API_TOKEN }}
          accountId: ${{ env.CF_RESOLVED_ACCOUNT_ID }}
          command: deploy
          secrets: |
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
        env:
          STRIPE_SECRET_KEY: ${{ secrets.BF_STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.BF_STRIPE_TEST_WEBHOOK_SECRET }}
      - name: Confirm preview-only mode remains enforced publicly
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://burtonfound.timharmar.workers.dev/api/health \
            | python3 -c 'import json,sys; j=json.load(sys.stdin); assert j.get("service")=="Burton & Found"; assert j.get("checkout")=="preview_only", "Checkout must remain disabled"; print("Verified: Worker healthy; checkout disabled")'

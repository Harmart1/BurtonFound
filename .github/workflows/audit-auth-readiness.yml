name: Verify Burton & Found registration and API safeguards (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/auth-audit-trigger.txt

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check software tests
        run: |
          npm run check:deploy
          npm test
      - name: Probe deployed account settings and reject unauthenticated admin access
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,sys
          base="https://burtonfound.timharmar.workers.dev"
          project="https://nyvdrgpcwfasajyncnhi.supabase.co"
          cfg=json.load(open("wrangler.jsonc",encoding="utf8"))["vars"]
          public_key=cfg.get("SUPABASE_PUBLISHABLE_KEY","")
          assert public_key.startswith("sb_publishable_"),"Missing browser publishable key"
          def get(url,headers=None,method="GET",body=None):
              cmd=["curl","--silent","--show-error","--max-time","20","--location","-w","\\n%{http_code}"]
              for key,value in (headers or {}).items():cmd.extend(["-H",key+": "+value])
              if method!="GET":cmd.extend(["--request",method])
              if body is not None:cmd.extend(["--data-binary","@-"])
              result=subprocess.run(cmd+[url],input=body,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
              if result.returncode:raise AssertionError("Unable to request deployed endpoint")
              raw,status=result.stdout.decode("utf8").rsplit(chr(10),1)
              try:parsed=json.loads(raw) if raw else {}
              except:parsed={}
              return int(status.strip()),parsed
          status,health=get(base+"/api/health")
          print("Deployed health response: HTTP",status,"service",health.get("service"),"checkout",health.get("checkout"),"note",str(health.get("note",""))[:100])
          assert status==200 and health.get("checkout")=="preview_only","Payment collection must remain disabled"
          status,account=get(base+"/api/public-account-config")
          assert status==200 and account.get("configured") is True
          assert account.get("supabaseUrl")==project
          assert account.get("supabasePublishableKey")==public_key
          assert "supabaseSecretKey" not in account
          status,catalog=get(base+"/api/catalog")
          assert status==200 and catalog.get("configured") is True and len(catalog.get("items",[]))==22
          for path,expect in [("/api/account-orders",401),("/api/admin/me",403),("/api/admin/readiness",403),("/api/admin/orders",403),("/api/admin/holds",403),("/api/admin/fulfillment-history?order_id=00000000-0000-0000-0000-000000000000",403)]:
              actual,_=get(base+path)
              assert actual==expect,"Authentication guard regression for "+path+" (HTTP "+str(actual)+")"
          actual,_=get(base+"/api/checkout",headers={"origin":base,"content-type":"application/json"},method="POST",body=b'{"skus":["OH-003"]}')
          assert actual==503,"Checkout must refuse payment session creation during integration"
          # Private PostgREST tables must reject anonymous reads even though the project API is reachable.
          for table in ["collector_profiles","bf_orders","bf_admin_users"]:
              status,_=get(project+"/rest/v1/"+table+"?select=*&limit=1",{"apikey":public_key,"Accept":"application/json"})
              assert status in (401,403),"Anonymous read must be rejected for "+table+"; received HTTP "+str(status)
          # An invalid Stripe signature must never reach the privileged paid-order handling RPC.
          status,_=get(base+"/api/stripe-webhook",headers={"origin":base,"content-type":"application/json","Stripe-Signature":"t=1,v1=invalid"},method="POST",body=b'{"id":"evt_invalid","type":"checkout.session.completed"}')
          assert status==400,"Unsigned Stripe webhook must be rejected; received HTTP "+str(status)
          auth_status,auth=get(project+"/auth/v1/settings",{"apikey":public_key,"Accept":"application/json"})
          assert auth_status==200 and isinstance(auth,dict),"Supabase Auth config API unavailable"
          email_enabled=auth.get("external",{}).get("email",None) if isinstance(auth.get("external"),dict) else None
          if email_enabled is False:
              print("WARNING: Supabase email/password provider is disabled; signup cannot work.")
          else:
              print("Supabase Auth settings endpoint reachable. Email provider flag:",email_enabled if email_enabled is not None else "not exposed")
          auto_confirm=auth.get("mailer_autoconfirm")
          if auto_confirm is not None:
              print("Email confirmation bypass enabled:",bool(auto_confirm))
          print("All deployed API guards passed: unauthenticated customer/admin calls blocked, 22 products available, Stripe checkout disabled.")
          print("NOTE: Auth Site URL, redirect allowlist and custom SMTP deliverability require authenticated Dashboard configuration checks.")
          PY
      - name: Verify private Supabase Auth Admin API accessibility without displaying users
        shell: bash
        env:
          BF_SUPABASE_SECRET_KEY: ${{ secrets.BF_SUPABASE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os,sys,re,json,urllib.request,urllib.error
          key=os.environ.get("BF_SUPABASE_SECRET_KEY","")
          if not re.fullmatch(r"sb_secret_[A-Za-z0-9_-]+",key):
              sys.exit("Supabase service secret absent or invalid format; owner activation cannot proceed.")
          req=urllib.request.Request("https://nyvdrgpcwfasajyncnhi.supabase.co/auth/v1/admin/users?page=1&per_page=1",
              headers={"apikey":key,"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  result=json.load(response)
          except urllib.error.HTTPError as e:
              sys.exit("Supabase Auth administrative access unavailable (HTTP %s). No data was changed."%e.code)
          if not isinstance(result,dict) or not isinstance(result.get("users"),list):
              sys.exit("Unexpected Supabase Auth admin API response; no data was changed.")
          print("Verified: read-only Supabase Auth Admin API access works with the stored server key. No users listed.")
          PY
      - name: Check owner-account activation readiness without granting privileges
        shell: bash
        env:
          BF_OWNER_EMAIL: ${{ secrets.BF_OWNER_EMAIL }}
          BF_SUPABASE_SECRET_KEY: ${{ secrets.BF_SUPABASE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error,sys
          email=os.environ.get("BF_OWNER_EMAIL","").strip().casefold()
          key=os.environ.get("BF_SUPABASE_SECRET_KEY","")
          if not email:
              print("Owner-admin activation pending: BF_OWNER_EMAIL is not set in GitHub Actions secrets.")
              sys.exit(0)
          if not re.fullmatch(r"[^@\\s]+@[^@\\s]+\\.[^@\\s]+",email) or len(email)>254:
              sys.exit("Owner email secret has invalid format; no administrator was granted.")
          if not key.startswith("sb_secret_"):
              sys.exit("Supabase secret unavailable; no administrator was granted.")
          matches=[]
          for page in range(1,11):
              req=urllib.request.Request(
                  "https://nyvdrgpcwfasajyncnhi.supabase.co/auth/v1/admin/users?page="+str(page)+"&per_page=100",
                  headers={"apikey":key,"Accept":"application/json"}
              )
              try:
                  with urllib.request.urlopen(req,timeout=20) as res: response=json.load(res)
              except urllib.error.HTTPError as exc:
                  sys.exit("Supabase owner verification failed (HTTP %s); no administrator was granted."%exc.code)
              users=response.get("users",[])
              matches.extend(user for user in users if str(user.get("email","")).strip().casefold()==email)
              if len(users)<100:break
          if len(matches)==1 and matches[0].get("email_confirmed_at"):
              print("Owner email secret matches one verified Supabase account. Owner grant may now be triggered after authorization; no privileges changed.")
          else:
              print("Owner email secret does not yet match exactly one verified account; no privileges changed.")
          PY

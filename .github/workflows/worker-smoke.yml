name: Verify Burton & Found public deployment

on:
  workflow_dispatch:
  schedule:
    - cron: '27 14 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/worker-smoke.yml

permissions:
  contents: read

concurrency:
  group: burtonfound-public-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public storefront, inventory and private API boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,sys,os,urllib.parse,xml.etree.ElementTree as ET
          origins=("https://burtonandfound.ca","https://www.burtonandfound.ca","https://burtonfound.timharmar.workers.dev")
          base=origins[0]
          checks=[]
          def get(path):
              p=subprocess.run(["curl","--silent","--show-error","--max-time","20","--retry","1","--location","--max-redirs","2","--proto-redir","=https","-w","\n%{http_code}\n%{url_effective}",base+path],capture_output=True,timeout=50)
              if p.returncode: raise RuntimeError("Connection failed")
              raw,code,final=p.stdout.rsplit(b"\n",2)
              u=urllib.parse.urlsplit(final.decode("ascii"))
              if u.scheme!="https" or u.netloc!=urllib.parse.urlsplit(base).netloc:raise RuntimeError("Unexpected redirect origin")
              return int(code),raw
          def check(label,path,expected,validator):
              try:
                  status,body=get(path)
                  ok=status==expected and bool(validator(body))
                  if not ok:print('REVIEW',label,'HTTP',status,'response bytes',len(body))
              except Exception: ok=False;print('REVIEW',label,'request/parse failed')
              checks.append((label,ok))
          def health(b):
              j=json.loads(b)
              return j.get("service")=="Burton & Found" and j.get("checkout")=="preview_only" and j.get("currency")=="CAD"
          def stock(b):
              j=json.loads(b)
              rows=j.get("items")
              return j.get("configured") is True and isinstance(rows,list) and bool(rows) and all(isinstance(x.get("sku"),str) and isinstance(x.get("available"),bool) and type(x.get("price_cents")) is int for x in rows)
          def account(b):
              j=json.loads(b)
              return j.get("configured") is True
          def sitemap(b):
              try:
                  doc=ET.fromstring(b)
                  urls=[e.text or '' for e in doc.findall('.//{*}loc')]
                  correct=sum(u.startswith("https://burtonandfound.ca/") for u in urls)
                  product=sum(u.startswith("https://burtonandfound.ca/products/") for u in urls)
                  print("Sitemap diagnostic:",base,"entries",len(urls),"branded",correct,"product",product)
                  return len(urls)==238 and correct==len(urls) and product==229
              except ET.ParseError:
                  print("Sitemap diagnostic:",base,"not valid XML; bytes",len(b))
                  return False
          for base in origins:
              check(base+" — Homepage HTML","/",200,lambda b:b"Burton" in b and b"<html" in b.lower() and b"cf-chl-" not in b.lower())
              check(base+" — Checkout remains preview-only","/api/health",200,health)
              check(base+" — Public account configuration","/api/public-account-config",200,account)
              check(base+" — Public inventory feed","/api/catalog",200,stock)
              check(base+" — Private bookkeeping protected","/api/admin/bookkeeping",403,lambda b:bool(json.loads(b).get("error")))
              check(base+" — Private Stripe reconciliation protected","/api/admin/stripe-reconciliation",403,lambda b:bool(json.loads(b).get("error")))
              check(base+" — Private orders protected","/api/admin/orders",403,lambda b:bool(json.loads(b).get("error")))
              check(base+" — Private readiness protected","/api/admin/readiness",403,lambda b:bool(json.loads(b).get("error")))
              check(base+" — Private CMS studio protected","/api/cms/studio",403,lambda b:bool(json.loads(b).get("error")))
              check(base+" — Customer account page","/account",200,lambda b:b'id="signInForm"' in b and b'id="signUpForm"' in b)
              check(base+" — Branded canonical homepage","/",200,lambda b:b'rel="canonical" href="https://burtonandfound.ca/"' in b)
              check(base+" — Branded sitemap","/sitemap.xml",200,sitemap)
              check(base+" — Collection preview","/preview.html",200,lambda b:b"prFeaturedGrid" in b and b"<html" in b.lower())
              check(base+" — Hollywood collection","/old-hollywood-new.html",200,lambda b:b"Old Hollywood" in b and b"<html" in b.lower())
              check(base+" — Preview script","/preview-launch.js",200,lambda b:b"prFeaturedGrid" in b and b"BURTON_FEATURED" in b)
              check(base+" — Real product photo","/assets/images/old-hollywood/ohnew-003-01.webp",200,lambda b:b[:4]==b"RIFF" and b[8:12]==b"WEBP")
          lines=["## Daily public storefront check","","| Check | Result |","|---|---|"]+["| "+name+" | "+("PASS" if ok else "FAIL")+" |" for name,ok in checks]
          report="\n".join(lines)+"\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:out.write(report)
          if not all(ok for _,ok in checks):sys.exit("One or more storefront checks failed; see summary.")
          PY
